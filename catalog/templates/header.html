<!-- header.html -->
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Megastore</h5>
    <div class="container-fluid">
    <nav class="d-flex justify-content-between align-items-center">
        <!-- Левый блок - 3 кнопки -->
        <div class="d-flex">
            <a class="p-2 btn btn-outline-primary me-2" href="/">Каталог</a>
            <a class="p-2 btn btn-outline-primary me-2" href="/categories/">Категории</a>
            <a class="p-2 btn btn-outline-primary me-2" href="/contacts/">Контакты</a>
            <a class="p-2 btn btn-outline-primary me-2" href="{% url 'blog:posts_list' %}">Блог</a>
        </div>
        
        <!-- Правый блок - 3 кнопки -->
        <div class="d-flex">
            {% if user.is_authenticated %}
            <a class="p-2 btn btn-primary" href="{% url 'users:logout' %}">Выйти</a>
            {% else %}
            <a class="p-2 btn btn-primary me-2" href="{% url 'users:login' %}">Войти</a>
            <a class="p-2 btn btn-primary me-2" href="{% url 'users:register' %}">Регистрация</a>
            {% endif %}
        </div>
    </nav>
</div>

</div>
