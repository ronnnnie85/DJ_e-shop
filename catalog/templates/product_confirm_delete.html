{% extends 'base.html' %}
{% load my_tags %}
{% block title %}Каталог{% endblock %}

{% block content %}
    <h2>Удалить товар</h2>
    <p>Вы уверены, что хотите удалить "{{ product.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'blog:posts_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
