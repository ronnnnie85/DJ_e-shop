{% extends 'base.html' %}
{% load my_tags %}
{% block title %}Блог{% endblock %}

{% block content %}
    <h2>{{ post.title }}</h2>
    <img src="{{ post.preview | media_filter }}" class="img-fluid" alt="...">
    <p>{{ post.content }}</p>
    <p>Дата публикации: {{ post.created_at|date:"d M Y" }}</p>
    <p>Количество просмотров: {{ post.number_of_views }}</p>
    <a href="{% url 'blog:post_edit' post.pk %}" class="btn btn-secondary">Редактировать</a>
    <a href="{% url 'blog:post_delete' post.pk %}" class="btn btn-danger">Удалить</a>
    <a href="{% url 'blog:posts_list' %}" class="btn btn-primary">Вернуться к списку</a>
{% endblock %}
